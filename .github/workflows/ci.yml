name: CI

# A push to `main` or `github_ci` runs the job, and so do a pull request into `main` and a
# manual dispatch. A tag or another branch runs nothing: the commit a tag names ran on the
# branch that carries it.
on:
  push:
    branches: [main, github_ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job reads the repository and writes nothing back.
permissions:
  contents: read

# A newer push to the same ref supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A job is what GitHub's concurrency limit counts, and the limit is the account's, shared by every
# repository on it, with five macOS jobs at once: past it a job more waits, and pays its own
# checkout, uv setup and sync when it starts. So the push runs five jobs: the gate at the newest
# interpreter, the suite on every other on Linux, the newest on macOS and on Windows, and the other
# checks. Each job's name says the interpreters it runs. The suite and the platforms wait for the
# gate, so a commit that fails it takes no macOS or Windows runner.

jobs:
  test:
    name: lint, types and tests, on Linux at 3.15
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      # The corpus and the containment suite are fetched at the commits the two tools pin;
      # the key follows those files, so a run downloads them only when one changes.
      - uses: actions/cache@v6.1.0
        with:
          path: results
          key: studies-${{ hashFiles('tools/corpus.py', 'tools/containment.py') }}
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      - run: uv run --no-sync python tools/check_markdown.py
      - run: uv run --no-sync python -X warn_default_encoding -m pytest
      # Every published count is one this code still produces.
      - run: uv run --no-sync python tools/suite.py --check docs/studies/json-schema-test-suite.json
      - run: uv run --no-sync python tools/suite.py --draft 2019-09 --check docs/studies/json-schema-test-suite-draft2019-09.json
      - run: uv run --no-sync python tools/suite.py --draft 7 --check docs/studies/json-schema-test-suite-draft7.json
      - run: uv run --no-sync python tools/suite.py --draft 6 --check docs/studies/json-schema-test-suite-draft6.json
      - run: uv run --no-sync python tools/suite.py --draft 4 --check docs/studies/json-schema-test-suite-draft4.json
      - run: uv run --no-sync python tools/suite.py --draft format --check docs/studies/json-schema-test-suite-format.json
      - run: uv run --no-sync python tools/corpus.py --check docs/studies/jsonschemabench.json
      - run: uv run --no-sync python tools/containment.py --check docs/studies/containment.json

  # The suite on every interpreter the classifiers name below the newest, which `test` runs, and
  # on the free-threaded build of each from 3.14, the first PEP 779 supports, as valgebra's push
  # runs its own: one Linux job, each interpreter in an environment of its own and in steps of its
  # own, so each reports apart and one that fails leaves the others to run. An import that turns
  # a free-threaded build's GIL back on warns and raises nothing, so the suite would pass on a
  # build running as a GIL build does: `tests/test_free_threading.py` fails there. A step that
  # names its own condition takes `success()` unless it names a status function, so each names
  # `success() || failure()`: any outcome but a canceled run.
  suite:
    name: the suite on Linux at 3.11, 3.12, 3.13, 3.14, 3.14t and 3.15t
    needs: [test]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", enable-cache: true }
      - name: sync 3.11
        id: sync-311
        env: { UV_PYTHON: "3.11", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.11" }
        run: uv sync --locked
      - name: the suite on 3.11
        if: ${{ (success() || failure()) && steps.sync-311.outcome == 'success' }}
        env: { UV_PYTHON: "3.11", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.11" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest
      - name: sync 3.12
        id: sync-312
        if: ${{ success() || failure() }}
        env: { UV_PYTHON: "3.12", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.12" }
        run: uv sync --locked
      - name: the suite on 3.12
        if: ${{ (success() || failure()) && steps.sync-312.outcome == 'success' }}
        env: { UV_PYTHON: "3.12", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.12" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest
      - name: sync 3.13
        id: sync-313
        if: ${{ success() || failure() }}
        env: { UV_PYTHON: "3.13", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.13" }
        run: uv sync --locked
      - name: the suite on 3.13
        if: ${{ (success() || failure()) && steps.sync-313.outcome == 'success' }}
        env: { UV_PYTHON: "3.13", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.13" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest
      - name: sync 3.14
        id: sync-314
        if: ${{ success() || failure() }}
        env: { UV_PYTHON: "3.14", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.14" }
        run: uv sync --locked
      - name: the suite on 3.14
        if: ${{ (success() || failure()) && steps.sync-314.outcome == 'success' }}
        env: { UV_PYTHON: "3.14", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.14" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest
      - name: sync 3.14t
        id: sync-314t
        if: ${{ success() || failure() }}
        env: { UV_PYTHON: "3.14t", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.14t" }
        run: uv sync --locked
      - name: the suite on 3.14t
        if: ${{ (success() || failure()) && steps.sync-314t.outcome == 'success' }}
        env: { UV_PYTHON: "3.14t", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.14t" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest
      - name: sync 3.15t
        id: sync-315t
        if: ${{ success() || failure() }}
        env: { UV_PYTHON: "3.15t", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.15t" }
        run: uv sync --locked
      - name: the suite on 3.15t
        if: ${{ (success() || failure()) && steps.sync-315t.outcome == 'success' }}
        env: { UV_PYTHON: "3.15t", UV_PROJECT_ENVIRONMENT: "${{ runner.temp }}/venv-3.15t" }
        run: uv run --no-sync python -X warn_default_encoding -m pytest

  # The suite at the newest interpreter on macOS and on Windows, so a defect one platform alone
  # reaches fails the push rather than the release smoke. The release reads the older interpreters
  # there.
  platforms:
    name: the suite on ${{ matrix.os }} at 3.15
    needs: [test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      - run: uv sync --locked
      - run: uv run --no-sync python -X warn_default_encoding -m pytest

  # Every other check, each a step that runs whatever failed before it (`success() || failure()`:
  # any outcome but a canceled run), so each reports apart:
  #
  # - the wheel a user installs, built as the release builds it, installed in an environment
  #   holding nothing else and imported with every warning an error, as valgebra's push installs
  #   its own;
  # - the site, built strict, which the workflow `Docs` publishes from `main` alone, so a dead
  #   link, a dead anchor or a page off the nav fails here first;
  # - `.github/workflows/actions.lock`, which names the commit every action a workflow runs
  #   resolves to, read against the workflows and against upstream: a `uses:` with no entry, or a
  #   tag moved off its locked commit, fails;
  # - zizmor's audit of the workflows: template injection, credential persistence, over-broad
  #   permissions and unpinned actions;
  # - each public name a release removed or changed since the last tag, as griffe reads it from
  #   every module's `__all__`, written as an annotation on the line that changed it; under 0.0.x
  #   a release may break any name, so nothing waits on the step: its list is what the release's
  #   changelog records under Changed and Removed;
  # - every locked Python dependency, of the package and of each group, against the PyPI advisory
  #   database: pip-audit reads the lock as a PEP 751 file, installs nothing and reads every
  #   package, one whose marker excludes this runner included, and `--strict` fails on a package
  #   it cannot audit.
  checks:
    name: the wheel, the site and the audits
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # griffe loads the last tag from git, so the history and its tags are fetched.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: true }
      - name: Build the wheel
        id: wheel
        run: |
          uv export --locked --only-group build --no-emit-project -o "$RUNNER_TEMP/build.txt"
          uv build --wheel --no-sources --build-constraints "$RUNNER_TEMP/build.txt" --require-hashes
      - name: Install the wheel and import it
        if: ${{ (success() || failure()) && steps.wheel.outcome == 'success' }}
        run: |
          uv venv "$RUNNER_TEMP/installed"
          uv pip install --python "$RUNNER_TEMP/installed" dist/*.whl
          uv pip check --python "$RUNNER_TEMP/installed"
          # `python -c` puts the working directory first on the path, and the root holds the
          # package: the import runs outside the tree, or it reads the checkout.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" -W error -c 'import importlib, pkgutil, importlib.metadata as md, valgebra_jsonschema as m; assert "site-packages" in m.__file__, m.__file__; [importlib.import_module(f"valgebra_jsonschema.{n.name}") for n in pkgutil.iter_modules(m.__path__)]; s = m.compile_schema({"type": "integer"}); assert s.is_valid(1) and s.is_valid(1.0) and not s.is_valid(True); print("wheel ok", md.version("valgebra-jsonschema"), "on valgebra", md.version("valgebra"))'
      - name: Sync the docs group
        id: docs
        if: ${{ success() || failure() }}
        run: uv sync --locked --group docs
      - name: Build the site, strict
        if: ${{ (success() || failure()) && steps.docs.outcome == 'success' }}
        run: uv run --no-sync zensical build --strict
      - name: Install the lockfile checker
        id: lock-checker
        if: ${{ success() || failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.5.1
      - name: Verify the workflow lockfile
        if: ${{ (success() || failure()) && steps.lock-checker.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
      - name: Audit the workflows
        if: ${{ success() || failure() }}
        # The token lets zizmor resolve each action's ref, beside the static audits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.33.1 .github/
      - name: Compare the API with the last tag
        if: ${{ success() || failure() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if git describe --tags --abbrev=0 --match 'v*' > /dev/null 2>&1; then
            uvx griffe==2.4.1 check valgebra_jsonschema -f github
          else
            echo "no release tag yet: nothing to compare"
          fi
      - name: Audit the locked dependencies
        if: ${{ success() || failure() }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/audit"
          uv export --locked --format pylock.toml --no-emit-project --all-groups -o "$RUNNER_TEMP/audit/pylock.toml"
          uvx pip-audit==2.10.1 --strict --locked "$RUNNER_TEMP/audit"
