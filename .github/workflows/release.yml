name: Release

# Build the wheel and the sdist, run the suite on each as installed, and publish both to a
# package index. Publishing happens only on a manual dispatch from `main` that selects an
# index and confirms the version, on a commit `ci.yml` passed; no tag push publishes. Uploads use trusted publishing, an
# OIDC token and no stored secret, and carry PEP 740 attestations. A dispatch with the target
# left at `none` builds and tests without publishing, as a dry run.
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Index to publish to; none builds and tests only"
        type: choice
        options: [none, testpypi, pypi]
        default: none
      confirm_version:
        description: "Exact version to publish (must match the built artifacts)"
        type: string
        default: ""

# One release at a time, and never canceled mid-publish: a half-finished upload is worse than
# a wait.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: wheel and sdist
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The files this job makes are the ones the publish job uploads, so every Python package
    # it runs comes from the lock, each hash required. hatchling fixes every timestamp, so two
    # builds of one commit give the same bytes.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with: { version: "0.13.10", python-version: "3.15", enable-cache: false }
      # Without `[tool.uv.sources]`, as every other build frontend reads the project, and with
      # the backend of the group `build`.
      - run: |
          uv export --locked --only-group build --no-emit-project -o "$RUNNER_TEMP/build.txt"
          uv build --no-sources --build-constraints "$RUNNER_TEMP/build.txt" --require-hashes
      # What the suite imports beside the package, at the lock's versions, for the smoke. It
      # travels apart from `dist`, every file of which the publish job uploads.
      - run: uv export --locked --only-group test --no-emit-project -o suite.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: suite
          path: suite.txt
          if-no-files-found: error

  # Each artifact is installed as a user installs it, its dependencies resolved from PyPI, and
  # the suite the sdist carries runs on it. A version cannot be replaced on an index once
  # uploaded, only yanked, so a broken artifact fails here.
  #
  # A leg is an artifact, a resolution and an interpreter, and a job runs every leg of its
  # platform, each in an environment of its own and a group of its own in the log, and fails at
  # the end naming each leg that failed: a job is what GitHub's concurrency limit counts, five
  # macOS jobs at once across the account, so the platform is the job and the interpreter is not.
  #
  # twine and what it imports resolve fresh, so they run here and not in the build job: they read
  # copies of the artifacts, and nothing a smoke job writes reaches the upload.
  smoke:
    name: smoke on ${{ matrix.platform.name }}
    needs: [build]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          # The sdist on the floor and the newest release: what it adds to the wheel is its file
          # list, which neither the interpreter nor the platform moves. And the wheel with each
          # dependency at the floor `pyproject.toml` names, where every other leg installs the
          # newest release each admits.
          - name: Linux, the sdist and the floors
            os: ubuntu-26.04
            metadata: true
            legs: sdist/highest/3.11 sdist/highest/3.15 wheel/lowest-direct/3.11 wheel/lowest-direct/3.15
          # The wheel on every CPython the classifiers name, on x86_64 Linux, Apple silicon macOS
          # and x64 Windows: an install of this package pulls the valgebra wheel of its
          # interpreter and platform, and each of those is a build of its own. valgebra's release
          # smokes its other wheels, macOS x86_64 among them, on each of their platforms.
          - name: Linux, the wheel
            os: ubuntu-26.04
            legs: wheel/highest/3.11 wheel/highest/3.12 wheel/highest/3.13 wheel/highest/3.14 wheel/highest/3.15
          - name: macOS, the wheel
            os: macos-26
            legs: wheel/highest/3.11 wheel/highest/3.12 wheel/highest/3.13 wheel/highest/3.14 wheel/highest/3.15
          - name: Windows, the wheel
            os: windows-2025-vs2026
            legs: wheel/highest/3.11 wheel/highest/3.12 wheel/highest/3.13 wheel/highest/3.14 wheel/highest/3.15
    # Windows runs the same script under Git's bash, where a virtual environment keeps its
    # executables in `Scripts` rather than `bin`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: suite
      - uses: astral-sh/setup-uv@v10.4.0
        # Nothing is checked out yet for the cache to key on.
        with: { version: "0.13.10", enable-cache: false }
      # The metadata, and the README as the index renders it.
      - if: ${{ matrix.platform.metadata }}
        run: uvx --python 3.15 twine==7.0.0 check --strict dist/*
      # The floors are the dependencies `pyproject.toml` names, read from the sdist and resolved
      # to the lowest release each admits, so the installed versions are the ones a user on the
      # floor holds.
      #
      # Then the sdist's own suite, so a file the suite reads and the sdist leaves out fails here.
      # It runs through the environment's `pytest` script, which puts no directory of the
      # unpacked tree on the path, from a working directory that holds no package: the suite
      # imports the installed artifact. The group `test` pins no package the artifact depends on
      # above its floor, so the floor legs keep their floors.
      - name: Install each artifact, import it and run the suite it carries, a leg at a time
        env:
          LEGS: ${{ matrix.platform.legs }}
        run: |
          # A leg stops at its first failure, in a subshell of its own; the loop runs every leg, so
          # the step's own shell does not stop at one, and GitHub starts it with `-e` set.
          set +e -uo pipefail
          mkdir suite && tar -xzf dist/*.tar.gz -C suite --strip-components 1 || exit 1
          leg() {
            set -euo pipefail
            local artifact="$1" resolution="$2" python="$3"
            local env=".venv-$artifact-$resolution-$python" file
            local bin="$env/bin"
            case "$artifact" in
              wheel) file="$(ls dist/*.whl)" ;;
              sdist) file="$(ls dist/*.tar.gz)" ;;
            esac
            uv venv --python "$python" "$env"
            [ -d "$env/Scripts" ] && bin="$env/Scripts"
            case "$resolution" in
              highest) uv pip install --python "$env" "$file" ;;
              lowest-direct) uv pip install --python "$env" --resolution lowest-direct -r suite/pyproject.toml "$file" ;;
            esac
            uv pip check --python "$env"
            uv pip list --python "$env"
            "$bin/python" -W error -c 'import importlib.metadata as md, valgebra_jsonschema as m; assert "site-packages" in m.__file__, m.__file__; s = m.compile_schema({"type": "integer"}); assert s.is_valid(1) and s.is_valid(1.0) and not s.is_valid(True); print("smoke ok", md.version("valgebra-jsonschema"), "on valgebra", md.version("valgebra"))'
            uv pip install --python "$env" -r suite.txt
            uv pip check --python "$env"
            "$bin/pytest" -p no:cacheprovider suite/tests
          }
          failed=()
          for spec in $LEGS; do
            IFS=/ read -r artifact resolution python <<< "$spec"
            echo "::group::$artifact, $resolution, $python"
            ( leg "$artifact" "$resolution" "$python" )
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::the smoke failed on $artifact, $resolution, $python"
              failed+=("$spec")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi

  publish:
    name: publish to ${{ inputs.publish_target }}
    needs: [build, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # A dry run uploads nothing, and a dispatch from another branch cannot publish a commit the
    # push lanes never read on `main`. A dispatch from a branch runs that branch's copy of this
    # file, which can drop the condition, so each environment admits `main` alone as well: a
    # rule of the repository's settings, which no branch edits.
    if: ${{ inputs.publish_target != 'none' && github.ref == 'refs/heads/main' }}
    # The environment named after the index is the one its trusted publisher names: PyPI and
    # TestPyPI each trust this workflow file in it.
    environment:
      name: ${{ inputs.publish_target }}
      url: ${{ inputs.publish_target == 'pypi' && 'https://pypi.org/p/valgebra-jsonschema' || 'https://test.pypi.org/p/valgebra-jsonschema' }}
    permissions:
      id-token: write # the OIDC token trusted publishing exchanges; it signs the attestations
      actions: read # the runs of `ci.yml` on the commit
      contents: read
    steps:
      - name: Refuse a commit the push lanes have not passed
        # The commit is one `ci.yml` passed on `main`: a push run of it on this very commit
        # concluded in success. A failed, canceled or unfinished run, none at all, or an API
        # that does not answer refuses.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success&per_page=1" --jq .total_count)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::ci.yml has no successful push run on $GITHUB_SHA"; exit 1
          fi
          echo "ci.yml passed on $GITHUB_SHA"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Refuse a version other than the confirmed one, or one the index serves
        # Fail closed. Only a definitive 404 for the version proceeds: a 200 is a re-publish,
        # and any other answer, a 5xx, a 429 or no connection, leaves the question open. A
        # version the index names as its latest is refused too, against a per-version answer
        # that has not caught up with an upload.
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          INDEX: ${{ inputs.publish_target == 'testpypi' && 'https://test.pypi.org' || 'https://pypi.org' }}
        run: |
          set -euo pipefail
          wheel="$(basename dist/*.whl)"
          built="${wheel#valgebra_jsonschema-}"; built="${built%%-*}"
          echo "built artifacts are version $built"
          if [ -z "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version is required to publish"; exit 1
          fi
          if [ "$built" != "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version '$CONFIRM_VERSION' is not the built version '$built'"; exit 1
          fi
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 \
            -o /dev/null -w '%{http_code}' "$INDEX/pypi/valgebra-jsonschema/$built/json" || echo 000)"
          case "$code" in
            404) echo "version $built is absent from $INDEX" ;;
            200) echo "::error::version $built is already on $INDEX; bump the version"; exit 1 ;;
            *) echo "::error::could not confirm version $built against $INDEX (HTTP $code)"; exit 1 ;;
          esac
          latest="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 "$INDEX/pypi/valgebra-jsonschema/json" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin).get("info", {}).get("version", ""))' 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "$built" = "$latest" ]; then
            echo "::error::version $built is already the latest on $INDEX; bump the version"; exit 1
          fi
          echo "version $built differs from the latest on $INDEX (${latest:-none})"
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: ${{ inputs.publish_target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # The step above refuses a version the index serves, so a duplicate upload is an
          # error here rather than a green run.
          skip-existing: false
