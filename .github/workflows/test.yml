name: test

on: [push, pull_request]

# The job reads the repository and writes nothing back.
permissions:
  contents: read

# A newer push to the same ref supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests, published studies
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: "0.13.8", python-version: "3.15", enable-cache: true }
      # The corpus and the containment suite are fetched at the commits the two tools pin;
      # the key follows those files, so a run downloads them only when one changes.
      - uses: actions/cache@v6.1.0
        with:
          path: results
          key: studies-${{ hashFiles('tools/corpus.py', 'tools/containment.py') }}
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run python tools/check_markdown.py
      - run: uv run pytest
      # Every published count is one this code still produces.
      - run: uv run python tools/suite.py --check docs/studies/json-schema-test-suite.json
      - run: uv run python tools/suite.py --draft 2019-09 --check docs/studies/json-schema-test-suite-draft2019-09.json
      - run: uv run python tools/suite.py --draft 7 --check docs/studies/json-schema-test-suite-draft7.json
      - run: uv run python tools/suite.py --draft 6 --check docs/studies/json-schema-test-suite-draft6.json
      - run: uv run python tools/suite.py --draft 4 --check docs/studies/json-schema-test-suite-draft4.json
      - run: uv run python tools/suite.py --draft format --check docs/studies/json-schema-test-suite-format.json
      - run: uv run python tools/corpus.py --check docs/studies/jsonschemabench.json
      - run: uv run python tools/containment.py --check docs/studies/containment.json

  floor:
    name: the suite on the oldest interpreter
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: "0.13.8", python-version: "3.11", enable-cache: true }
      - run: uv sync --locked
      - run: uv run pytest

  actions-lock:
    name: the actions lockfile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # `.github/workflows/actions.lock` names the commit every action a workflow runs resolves
    # to, an action another action calls included, and the runner runs that commit. This reads
    # the file against the workflows and against upstream: a `uses:` with no entry, or a tag
    # moved off its locked commit, fails here.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the lockfile checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  zizmor:
    name: the workflow audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Static analysis of the workflows themselves: template injection, credential persistence,
    # over-broad permissions and unpinned actions.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: "0.13.8", python-version: "3.15", enable-cache: false }
      - name: Audit the workflows
        # The token lets zizmor resolve each action's ref, beside the static audits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 .github/

  pip-audit:
    name: the dependency audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Every locked Python dependency, of the package and of each group, against the PyPI
    # advisory database. pip-audit reads the lock as a PEP 751 file: it installs nothing, and
    # it reads every package, one whose marker excludes this runner included. `--strict` fails
    # the job on a package it cannot audit, where a plain run would only skip it.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: "0.13.8", python-version: "3.15", enable-cache: false }
      - name: Audit the locked dependencies
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/audit"
          uv export --locked --format pylock.toml --no-emit-project --all-groups -o "$RUNNER_TEMP/audit/pylock.toml"
          uvx pip-audit==2.10.1 --strict --locked "$RUNNER_TEMP/audit"
