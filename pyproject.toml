[project]
name = "valgebra-jsonschema"
version = "0.0.1"
description = "JSON Schema read into valgebra's sets: membership as the specification states it, and inclusion decided between two schemas."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Pasquale Pigazzini" }]
requires-python = ">=3.11"
keywords = ["json-schema", "validation", "mcp", "valgebra", "subschema"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    # The range, length and step markers the compiled schemas carry. valgebra reads them
    # structurally and does not depend on the package, so this is a direct dependency.
    "annotated-types>=0.8.0",
    # `TypedDict(closed=True)` on the floor, for the study files.
    "typing-extensions>=4.16.0",
    # The decision procedure every answer here rests on. Pre-alpha, so pinned below 0.1,
    # and a 0.0.x minor is a breaking release: the floor moves with each release.
    "valgebra>=0.0.25,<0.0.26",
]

[project.urls]
Repository = "https://github.com/ppigazzini/valgebra-jsonschema"
Documentation = "https://github.com/ppigazzini/valgebra-jsonschema/tree/main/docs"
Changelog = "https://github.com/ppigazzini/valgebra-jsonschema/blob/main/CHANGELOG.md"
Issues = "https://github.com/ppigazzini/valgebra-jsonschema/issues"

[dependency-groups]
# What the suite imports beside the package. The release smoke installs this group alone
# beside the built artifact, so a module the suite needs and no group names fails there.
test = [
    # The second implementation: `tests/test_properties.py` compares membership on random
    # schemas, and `tools/suite.py --reference` runs it on the optional suite files.
    "jsonschema>=4.26.0",
    # What the Python SDK and FastMCP emit: `tests/test_mcp.py` reads its schemas as written.
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
]
dev = [
    { include-group = "test" },
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]
# The backend `[build-system]` names, at the lock's version and hashes: the release workflow
# builds the published artifacts with it alone, so a backend release reaches them only through
# a lock update.
build = ["hatchling>=1.33.0"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valgebra_jsonschema"]

# The package, its suite and the pages the suite reads, beside the README, the licenses and
# this file, which every sdist carries. The tools fetch what they study, so they stay out.
[tool.hatch.build.targets.sdist]
include = ["valgebra_jsonschema", "tests", "docs", "CHANGELOG.md"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
faulthandler_timeout = 600
faulthandler_exit_on_timeout = true

[tool.ty.environment]
python-version = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # --- formatter conflicts: ruff-format owns these ---
    "COM812", "ISC001",
    # --- a schema is read at runtime, so its names stay imported ---
    "TC001", "TC002", "TC003",
    # --- deliberate ---
    "T201",     # print: the tools ARE command line programs; stdout is their output
    "CPY001",   # missing-copyright-notice: LICENSE covers the tree
    "S311",     # seeded `random.Random` IS the requirement: every draw must reproduce
    "ANN401",   # a JSON value is `Any`: anything `json.loads` returns
    "D105", "D107",
    # --- docstring style: numpy convention ---
    "D203", "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
# The search, the verifier walk and the runner each dispatch on the four step kinds and
# carry two outcomes per kind; split further, each would hide its one invariant.
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8
max-returns = 8

[tool.ruff.lint.per-file-ignores]
# RUF001: the dialect tests are about the characters ruff calls ambiguous.
"tests/*" = ["S101", "D", "ANN", "PLR2004", "INP001", "SLF001", "FBT003", "RUF001"]
"tools/*" = ["INP001"]
"examples/*" = ["INP001", "T201"]
